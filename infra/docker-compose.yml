services:
  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: dropdat-api
    env_file:
      - .env
    environment:
      - ADDR=:8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-dropdat}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-dropdat}?sslmode=${POSTGRES_SSLMODE:-disable}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://dropdat.app,https://www.dropdat.app,https://capsule.dropdat.app}
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - CLERK_ISSUER=${CLERK_ISSUER}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - DEV_AUTH_BYPASS=${DEV_AUTH_BYPASS:-}
      - DEV_USER_ID=${DEV_USER_ID:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_EMBED_MODEL=${OPENAI_EMBED_MODEL:-}
      - DODO_PAYMENTS_API_KEY=${DODO_PAYMENTS_API_KEY:-}
      - DODO_PAYMENTS_ENVIRONMENT=${DODO_PAYMENTS_ENVIRONMENT:-test_mode}
      - DODO_WEBHOOK_SECRET=${DODO_WEBHOOK_SECRET:-}
      - APP_URL=${APP_URL:-https://capsule.dropdat.app}
      - DODO_PRO_MONTHLY_PRODUCT_ID=${DODO_PRO_MONTHLY_PRODUCT_ID:-}
      - DODO_PRO_ANNUAL_PRODUCT_ID=${DODO_PRO_ANNUAL_PRODUCT_ID:-}
      - DODO_PREMIUM_MONTHLY_PRODUCT_ID=${DODO_PREMIUM_MONTHLY_PRODUCT_ID:-}
      - DODO_PREMIUM_ANNUAL_PRODUCT_ID=${DODO_PREMIUM_ANNUAL_PRODUCT_ID:-}
      - DODO_ULTIMATE_MONTHLY_PRODUCT_ID=${DODO_ULTIMATE_MONTHLY_PRODUCT_ID:-}
      - DODO_ULTIMATE_ANNUAL_PRODUCT_ID=${DODO_ULTIMATE_ANNUAL_PRODUCT_ID:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET=${R2_BUCKET:-}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: dropdat-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dropdat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-dropdat}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dropdat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: dropdat-caddy
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-dropdat.app}
      ACME_EMAIL: ${ACME_EMAIL:-admin@dropdat.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../web/out:/var/www/dropdat:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  caddy-config:
